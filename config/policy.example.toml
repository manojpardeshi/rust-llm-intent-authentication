# Policy: first matching rule wins; anything unmatched hits [default].
#
# Always enforced regardless of this file:
#   - Malicious intents are denied.
#   - [default] may not be "allow".
#   - "allow" rules must name a concrete category and grant at least one scope.
#   - Token lifetime is capped at 300s by the issuer.

[[rule]]
category = "ReadData"
decision = "allow"
scopes = ["data:read"]
ttl_secs = 120
min_confidence = 0.7

[[rule]]
category = "WriteData"
action = "delete_*"
decision = "deny"
reason = "deletes are never automated"

[[rule]]
category = "WriteData"
action = "sql_write"
decision = "step_up"
reason = "schema/data changes need approval"

[[rule]]
category = "WriteData"
decision = "allow"
scopes = ["data:write"]
# Only rule-derived intents (optionally LLM-confirmed) may earn write tokens.
sources = ["rules", "hybrid"]
ttl_secs = 60
min_confidence = 0.9

[[rule]]
category = "SendMessage"
decision = "allow"
scopes = ["messages:send"]
sources = ["rules", "hybrid"]
ttl_secs = 60
min_confidence = 0.85

[[rule]]
category = "Financial"
decision = "step_up"
reason = "financial actions require human approval"

[[rule]]
category = "AdminConfig"
decision = "step_up"

[default]
decision = "deny"
reason = "no policy rule permits this intent"
