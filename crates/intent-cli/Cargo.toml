[package]
name = "intent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
intent-classify = { version = "0.1.0", path = "../intent-classify" }
intent-core = { version = "0.1.0", path = "../intent-core" }
intent-policy = { version = "0.1.0", path = "../intent-policy" }
intent-token = { version = "0.1.0", path = "../intent-token" }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros"] }

[features]
default = ["llm"]
llm = ["intent-classify/llm"]

[[bin]]
name = "intent"
path = "src/main.rs"
