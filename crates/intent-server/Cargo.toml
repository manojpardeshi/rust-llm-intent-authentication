[package]
name = "intent-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "intent-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.4"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
governor = "0.10.4"
intent-classify = { version = "0.1.0", path = "../intent-classify" }
intent-core = { version = "0.1.0", path = "../intent-core" }
intent-policy = { version = "0.1.0", path = "../intent-policy" }
intent-token = { version = "0.1.0", path = "../intent-token" }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
notify = "8.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
toml = "1.2.0"
tower-http = { version = "0.7.1", features = ["trace", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
base64 = "0.23.1"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[features]
default = ["llm"]
llm = ["intent-classify/llm"]
