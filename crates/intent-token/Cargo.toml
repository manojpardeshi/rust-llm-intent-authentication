[package]
name = "intent-token"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
ed25519-dalek = { version = "2", features = ["pkcs8", "zeroize"] }
getrandom = "0.4.3"
intent-core = { version = "0.1.0", path = "../intent-core" }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v7"] }
zeroize = { version = "1.9.1", features = ["serde"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
