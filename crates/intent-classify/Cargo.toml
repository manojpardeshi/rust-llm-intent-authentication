[package]
name = "intent-classify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
intent-core = { version = "0.1.0", path = "../intent-core" }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"], optional = true }
toml = "1.1.8"
tracing = "0.1.44"

[dev-dependencies]
proptest = "1.12.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread"] }
wiremock = "0.6.5"

[features]
llm = ["dep:reqwest", "dep:tokio"]
