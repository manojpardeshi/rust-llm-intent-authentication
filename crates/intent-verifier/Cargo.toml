[package]
name = "intent-verifier"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
intent-core = { version = "0.1.0", path = "../intent-core" }
intent-token = { version = "0.1.0", path = "../intent-token" }
axum = { version = "0.8.9", default-features = false, features = ["json"], optional = true }
http-body-util = { version = "0.1.5", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time"] }
tower = { version = "0.5.3", default-features = false, optional = true }
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
http-body-util = "0.1.5"
intent-server = { version = "0.1.0", path = "../intent-server", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[features]
default = ["axum"]
axum = ["dep:axum", "dep:tower", "dep:http-body-util"]

[[example]]
name = "tool_gateway"
required-features = ["axum"]
